name: release

on:
  workflow_call:
    inputs:
      artifact_name:
        description: >-
          Name of a build artifact uploaded earlier in the same workflow run. When set, the
          artifact is downloaded into release-artifacts/ before semantic-release runs and the
          bundled config attaches its contents to the GitHub release. A caller that ships its
          own semantic-release config must declare release-artifacts/** in its own assets.
        type: string
        required: false
        default: ""
      dry_run:
        description: >-
          Compute the version that would be released without creating a tag or release. Use
          this to learn the version before a build, so the build can stamp it in.
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: >-
          The version released, or under dry_run the version that would be released. Empty
          when the commits since the last release do not warrant one.
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIRECTORY: release-artifacts
    outputs:
      version: ${{ steps.semantic_release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs every tag and commit to derive the next version
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.artifact_name != '' && !inputs.dry_run
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.ARTIFACT_DIRECTORY }}

      - name: Provide bundled semantic-release config unless the caller has its own
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if compgen -G ".releaserc*" > /dev/null || compgen -G "release.config.*" > /dev/null; then
            echo "Caller ships its own semantic-release config - using it."
            exit 0
          fi
          cat > .releaserc.json <<'CONFIG'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                "releaseRules": [
                  { "breaking": true, "release": "major" },
                  { "type": "feat", "release": "minor" },
                  { "type": "docs", "release": false },
                  { "type": "test", "release": false },
                  { "type": "fix", "release": "patch" },
                  { "type": "perf", "release": "patch" },
                  { "type": "refactor", "release": "patch" },
                  { "type": "style", "release": "patch" },
                  { "type": "build", "release": "patch" },
                  { "type": "ci", "release": "patch" },
                  { "type": "chore", "release": "patch" },
                  { "type": "revert", "release": "patch" }
                ]
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "conventionalcommits"
              }],
              ["@semantic-release/github", {
                "successComment": false,
                "failComment": false,
                "failTitle": false
              }]
            ]
          }
          CONFIG
          if [ -n "$ARTIFACT_NAME" ]; then
            jq --arg path "$ARTIFACT_DIRECTORY/**" \
              '.plugins |= map(
                 if type == "array" and .[0] == "@semantic-release/github"
                 then .[1].assets = [{ path: $path }]
                 else . end
               )' .releaserc.json > .releaserc.json.tmp
            mv .releaserc.json.tmp .releaserc.json
          fi

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        # conventionalcommits preset: recognizes the `type!:` breaking-change shorthand,
        # which the default angular preset does not
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/semantic-release.log"
          dry_run_flag=""
          if [ "$DRY_RUN" = "true" ]; then
            dry_run_flag="--dry-run"
          fi
          npx --yes -p conventional-changelog-conventionalcommits@9.3.1 -p semantic-release@25.0.6 semantic-release $dry_run_flag 2>&1 | tee "$log"
          if grep -qF "no new version is released" "$log"; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/.*Published release \([^ ]*\) on .*/\1/p' "$log" | tail -n1)
          if [ -z "$version" ]; then
            echo "Could not determine the released version from semantic-release output." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
