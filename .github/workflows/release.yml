name: release

on:
  workflow_call: {}

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # semantic-release needs every tag and commit to derive the next version
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Provide bundled semantic-release config unless the caller has its own
        shell: bash
        run: |
          if compgen -G ".releaserc*" > /dev/null || compgen -G "release.config.*" > /dev/null; then
            echo "Caller ships its own semantic-release config - using it."
            exit 0
          fi
          cat > .releaserc.json <<'CONFIG'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                "releaseRules": [
                  { "breaking": true, "release": "major" },
                  { "type": "feat", "release": "minor" },
                  { "type": "docs", "release": false },
                  { "type": "test", "release": false },
                  { "type": "fix", "release": "patch" },
                  { "type": "perf", "release": "patch" },
                  { "type": "refactor", "release": "patch" },
                  { "type": "style", "release": "patch" },
                  { "type": "build", "release": "patch" },
                  { "type": "ci", "release": "patch" },
                  { "type": "chore", "release": "patch" },
                  { "type": "revert", "release": "patch" }
                ]
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "conventionalcommits"
              }],
              ["@semantic-release/github", {
                "successComment": false,
                "failComment": false,
                "failTitle": false
              }]
            ]
          }
          CONFIG

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # conventionalcommits preset: recognizes the `type!:` breaking-change shorthand,
        # which the default angular preset does not
        run: npx --yes -p conventional-changelog-conventionalcommits@9.3.1 -p semantic-release@25.0.6 semantic-release
